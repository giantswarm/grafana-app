suite: grafana-mcp instance
templates:
  - charts/grafanaMcp/templates/deployment.yaml
  - charts/grafanaMcp/templates/configmap.yaml
  - charts/grafanaMcp/templates/serviceaccount.yaml
  - charts/grafanaMcp/templates/servicemonitor.yaml
  - charts/grafanaMcp/templates/service.yaml
  - charts/grafanaMcp/templates/poddisruptionbudget.yaml
  - charts/grafanaMcp/templates/clusterrole.yaml
  - charts/grafanaMcp/templates/clusterrolebinding.yaml
  - charts/grafanaMcp/templates/role.yaml
  - charts/grafanaMcp/templates/rolebinding.yaml
  - charts/grafanaMcp/templates/ingress.yaml
release:
  name: grafana
  namespace: monitoring
set:
  grafanaMcp.enabled: true
tests:

  - it: renders one replica
    template: charts/grafanaMcp/templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: grafana-mcp
      - equal:
          path: spec.replicas
          value: 1

  - it: starts the new pod before it stops the old one
    template: charts/grafanaMcp/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0

  - it: renders no PodDisruptionBudget
    template: charts/grafanaMcp/templates/poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no RBAC
    templates:
      - charts/grafanaMcp/templates/clusterrole.yaml
      - charts/grafanaMcp/templates/clusterrolebinding.yaml
      - charts/grafanaMcp/templates/role.yaml
      - charts/grafanaMcp/templates/rolebinding.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts no service account token
    templates:
      - charts/grafanaMcp/templates/deployment.yaml
      - charts/grafanaMcp/templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: grafana-mcp
      - equal:
          path: automountServiceAccountToken
          value: false
        template: charts/grafanaMcp/templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: charts/grafanaMcp/templates/deployment.yaml

  - it: renders no ingress
    template: charts/grafanaMcp/templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: turns basic auth and the login form off
    template: charts/grafanaMcp/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '\[auth\.basic\]\n\s*enabled = false\n'
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '\[auth\]\n\s*disable_login_form = true\n'

  - it: evaluates no alerts and joins no alert cluster
    template: charts/grafanaMcp/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '\[unified_alerting\]\n\s*execute_alerts = false\n'
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: 'ha_peers'

  - it: verifies Dex tokens with a connector-scoped login and no email claim
    template: charts/grafanaMcp/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '\[auth\.jwt\]\n\s*auto_sign_up = true\n\s*cache_ttl = 5m\n\s*enabled = true\n\s*header_name = X-JWT-Assertion\n\s*org_attribute_path = groups\n\s*role_attribute_path = to_string\(''None''\)\n\s*role_attribute_strict = true\n\s*username_attribute_path = join\('':'', \[federated_claims\.connector_id, replace\(email, ''@'', ''_at_''\)\]\)\n'
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: 'email_claim|email_attribute_path|username_claim'

  - it: uses the same secret_key source as the main Grafana, Grafana's default
    templates:
      - charts/grafanaMcp/templates/configmap.yaml
      - charts/grafanaMcp/templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: 'secret_key'
        template: charts/grafanaMcp/templates/configmap.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_SECURITY_SECRET_KEY
          any: true
        template: charts/grafanaMcp/templates/deployment.yaml

  - it: reads the JWT org mapping from an optional Secret
    template: charts/grafanaMcp/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_JWT_ORG_MAPPING
            valueFrom:
              secretKeyRef:
                name: grafana-mcp-org-mapping
                key: orgMapping
                optional: true

  - it: renders a ServiceMonitor that selects only grafana-mcp
    template: charts/grafanaMcp/templates/servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: grafana-mcp
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: grafana
            app.kubernetes.io/name: grafanaMcp

  - it: serves the Grafana port in the cluster
    template: charts/grafanaMcp/templates/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/instance: grafana
            app.kubernetes.io/name: grafanaMcp
