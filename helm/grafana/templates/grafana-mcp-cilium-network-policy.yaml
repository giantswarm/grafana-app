{{- if and .Values.grafanaMcp.enabled .Values.ciliumNetworkPolicy.enabled }}
# grafana-mcp accepts the caller's Dex token as identity, so only the MCP server,
# the image renderer and the metrics scrapers may reach it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    {{- include "grafanaMcp.selectorLabels" . | nindent 4 }}
  name: grafana-mcp
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "grafanaMcp.selectorLabels" . | nindent 6 }}
  ingress:
    # MCP server calls, carrying the caller's Dex token.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.grafanaMcp.ciliumNetworkPolicy.mcpClients.namespace }}
            {{- with .Values.grafanaMcp.ciliumNetworkPolicy.mcpClients.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Image renderer callback.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana-image-renderer
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Metrics scrapers.
    {{- with .Values.grafanaMcp.ciliumNetworkPolicy.metricsScrapers }}
    - fromEndpoints:
        {{- range . }}
        - matchLabels:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    {{- end }}
  egress:
    # Shared database.
    - toEndpoints:
        - matchLabels:
            {{- include "grafana.postgresql.labels" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Image renderer render requests.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana-image-renderer
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: coredns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: k8s-dns-node-cache
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "1053"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "1053"
              protocol: TCP
    # Dex keys (jwk_set_url) and datasources (Loki, Mimir, Tempo and any
    # user-defined datasource), reached the same way as from the main Grafana:
    # datasource URLs are user-defined, so neither ports nor peers are fixed.
    - toEntities:
        - cluster
        - world
{{- end }}
