{{- /*
The S3 region for the ObjectStores, on the existing-Secret path: barman reads
s3Credentials.region from a Secret, not a string. The helpers run only once backups or a
recovery are configured, so their render errors never fire without an ObjectStore.
*/ -}}
{{- $s3 := .Values.postgresqlCluster.objectStorage.s3 }}
{{- if and .Values.postgresqlCluster.enabled (or .Values.postgresqlCluster.backup.enabled .Values.postgresqlCluster.recovery.enabled) (eq .Values.postgresqlCluster.objectStorage.type "s3") (not (and $s3.accessKeyId $s3.secretAccessKey)) }}
{{- $secret := include "grafana.cnpg.s3.credentialsSecret" . | fromJson }}
{{- $region := include "grafana.cnpg.s3.region" . }}
{{- if and $secret.name $region }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  name: {{ .Values.postgresqlCluster.name }}-s3-region
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  REGION: {{ $region | quote }}
{{- end }}
{{- end }}
