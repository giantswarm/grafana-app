{{- if and .Values.postgresqlCluster.enabled .Values.postgresqlCluster.backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    observability.giantswarm.io/tenant: giantswarm
  name: {{ .Values.postgresqlCluster.name }}-objectstore-backup
  namespace: {{ .Release.Namespace }}
spec:
  configuration:
    destinationPath: {{ include "grafana.cnpg.backup.destinationPath" . | quote }}
    {{- include "grafana.cnpg.objectStoreCredentials" . | trim | nindent 4 }}
    {{- with .Values.postgresqlCluster.backup.encryption.data }}
    data:
      encryption: {{ . | quote }}
    {{- end }}
    wal:
      compression: gzip
      {{- with .Values.postgresqlCluster.backup.encryption.wal }}
      encryption: {{ . | quote }}
      {{- end }}
  retentionPolicy: {{ .Values.postgresqlCluster.backup.retentionPolicy | quote }}
{{- end }}
