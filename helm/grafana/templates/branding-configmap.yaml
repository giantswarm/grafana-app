{{/*
Giant Swarm branding assets (see the `branding/` directory).

The upstream Grafana image resolves its logo and favicons from files on disk, so
`grafana.extraConfigmapMounts` in values.yaml mounts the keys of this ConfigMap
over them. `subPath` mounts are not updated in place by kubelet, so the pod has
to restart to pick up a changed asset - that is what the
`checksum/giantswarm-branding` pod annotation in values.yaml is for.

Keys are in alphabetical order throughout, including the ones this renders from
the asset file names, because kube-linter's `sorted-keys` check requires it.
Round tripping the labels through fromYaml sorts them for the same reason.
*/}}
apiVersion: v1
{{- with (.Files.Glob "branding/*") }}
binaryData:
  {{- range $path, $_ := . }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc }}
  {{- end }}
{{- end }}
kind: ConfigMap
metadata:
  labels:
    {{- include "grafana.labels" . | fromYaml | toYaml | nindent 4 }}
  # Kept a literal so it matches the `configMap:` references in values.yaml.
  name: grafana-branding
  namespace: {{ .Release.Namespace }}
