version: 2.1
orbs:
  architect: giantswarm/architect@9.6.0
jobs:
  template-chart:
    docker:
      - image: giantswarm/helm-chart-testing:v3.14.0
    steps:
      - checkout
      - run: cd helm/grafana && helm dep up
      - run: helm template helm/grafana

  # Grafana serves its logo from a webpack asset whose file name carries a
  # content hash, so a Grafana upgrade can silently move the file our branding
  # mounts over. Catch that here instead of on a customer installation.
  verify-branding:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run: make branding-verify

workflows:
  package-and-push-chart-on-tag:
    jobs:
      - template-chart:
          name: "template-chart"
          # Trigger job on git tag.
          filters:
            tags:
              only: /^v.*/

      - verify-branding:
          name: "verify-branding"
          # Trigger job on git tag.
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-app-catalog:
          context: "architect"
          executor: "app-build-suite"
          name: app-catalog
          app_catalog: "giantswarm-catalog"
          app_catalog_test: "giantswarm-test-catalog"
          chart: "grafana"
          persist_chart_archive: true
          override_app_version: false
          # Trigger job on git tag.
          filters:
            tags:
              only: /^v.*/
          requires:
            - "template-chart"
            - "verify-branding"

      - architect/push-to-app-catalog:
          context: "architect"
          executor: "app-build-suite"
          name: control-plane-catalog
          app_catalog: "control-plane-catalog"
          app_catalog_test: "control-plane-test-catalog"
          chart: "grafana"
          override_app_version: false
          # Trigger job on git tag.
          filters:
            tags:
              only: /^v.*/
          requires:
            - "template-chart"
            - "verify-branding"

      - architect/run-tests-with-ats:
          name: run-chart-tests-with-ats
          filters:
            # Do not trigger the job on merge to main.
            branches:
              ignore:
                - main
          requires:
            - "app-catalog"
